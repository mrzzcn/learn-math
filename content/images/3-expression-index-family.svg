<text x="400" y="160" fill="#57606a" stroke="none" text-anchor="middle" font-size="12">对式子开平方</text>
<text x="400" y="178" fill="#57606a" stroke="none" text-anchor="middle" font-size="12">如 √x</text>
</svg>
