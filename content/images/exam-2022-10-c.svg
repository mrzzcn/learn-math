<text x="24" y="150" fill="#1f2328" stroke="none" font-size="13">酒驾（20 mg/100mL ≤ M ≤ 80 mg/100mL）</text>
<text x="24" y="176" fill="#1f2328" stroke="none" font-size="13">醉驾（M &gt; 80 mg/100mL）</text>
