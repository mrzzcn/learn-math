<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 225" width="360" height="225" font-size="14" font-family="-apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Noto Sans SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" fill="none">
<polygon points="10,10 350,10 350,190 10,190" fill="none" stroke="#1f2328" stroke-width="1.5" stroke-linejoin="round"/>
<text x="180" y="40" fill="#1f2328" stroke="none" text-anchor="middle" font-size="17">信息窗</text>
<text x="24" y="72" fill="#1f2328" stroke="none" font-size="13">M = 2200 × K × 10<tspan font-size="9" dy="-6">−3</tspan><tspan dy="6"> mg/100mL</tspan></text>
<text x="24" y="98" fill="#1f2328" stroke="none" font-size="13">（M 为血液酒精浓度，K 为呼气酒精浓度）</text>
