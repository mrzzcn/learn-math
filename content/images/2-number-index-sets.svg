<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 290" width="490" height="290" font-size="14" font-family="-apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Noto Sans SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" fill="none">
<rect x="10" y="10" width="470" height="270" rx="12" fill="none" stroke="#1f2328" stroke-width="1.8"/>
